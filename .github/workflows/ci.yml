name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        dependencies: [lowest, stable]
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Testbench pins the framework: 10.x runs Laravel 12, 11.x runs Laravel 13.
      - name: Select Laravel ${{ matrix.laravel }}
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies (${{ matrix.dependencies }})
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --no-interaction --no-progress --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --no-progress --prefer-stable
          fi

      # Style, static analysis and refactoring rules describe the code, not its
      # compatibility, so they run against the current tool versions only.
      - name: Code style
        if: matrix.dependencies == 'stable'
        run: composer lint

      - name: Static analysis
        if: matrix.dependencies == 'stable'
        run: composer analyse

      - name: Refactoring rules (dry run)
        if: matrix.dependencies == 'stable'
        run: composer refactor:check

      - name: Tests (unit and feature suites)
        run: composer test -- --colors=always
